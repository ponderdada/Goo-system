# ============================================================
# 投資決策系統設定檔
# ============================================================

# --- 模組一：現金 vs 投資配置（逆向加碼策略） ---
# 核心邏輯：恐慌越高 → 投入越多；回檔越深 → 投入越多
cash_allocation:

  # ── 訊號一：VIX 恐慌指標（逆向）──
  # 別人恐懼時我貪婪：VIX 越高代表市場越恐慌，反而是加碼好時機
  vix_thresholds:
    calm: 15        # VIX < 15: 市場過於平靜，可能見頂
    normal: 25      # VIX 15~25: 正常波動
    fear: 35        # VIX 25~35: 恐慌升溫，開始加碼

  # VIX 對應的現金比例（注意：越恐慌 → 現金越少）
  vix_cash_ratios:
    calm: 0.55      # 市場安逸時保留 55% 現金（高檔警戒）
    normal: 0.35    # 正常時保留 35% 現金
    fear: 0.15      # 恐慌時只保留 15% 現金（積極投入）
    panic: 0.05     # 極度恐慌時只保留 5% 現金（全力加碼）

  # ── 訊號二：大盤回檔深度 ──
  # 從近期高點回跌越多，越值得投入
  drawdown_lookback_days: 40    # 往回看 40 個交易日（約 2 個月）找高點

  drawdown_levels:
    pullback: 0.03    # 回檔 3% 以上算小回檔
    correction: 0.10  # 回檔 10% 以上算修正
    bear: 0.20        # 回檔 20% 以上算熊市

  # 回檔深度對應的現金比例（越跌 → 現金越少）
  drawdown_cash_ratios:
    near_high: 0.55   # 接近高點：保留 55% 現金（高檔不追）
    pullback: 0.35    # 小回檔：保留 35% 現金
    correction: 0.15  # 修正回檔：保留 15% 現金（積極投入）
    bear: 0.05        # 熊市：只保留 5% 現金（全力加碼）

  # ── 合成設定 ──
  weight_vix: 0.5         # VIX 訊號權重
  weight_drawdown: 0.5    # 回檔訊號權重
  min_cash_floor: 0.05    # 最低現金底線（永遠保留至少 5%）

# --- 模組二：指數 vs 個股配置 ---
index_vs_stock:
  # 基準配置（指數佔投資部位比例）
  base_index_ratio: 0.60

  # 市場寬度指標：漲跌家數比
  # 若多數個股上漲 => 市場健康，可多配個股
  # 若僅少數權值股撐盤 => 選股困難，應多配指數
  breadth_thresholds:
    healthy: 0.60    # 漲跌比 > 60% 為健康
    narrow: 0.40     # 漲跌比 < 40% 為窄幅

  breadth_adjustments:
    healthy: -0.15   # 市場健康時，指數比例 -15%（多配個股）
    narrow: 0.15     # 窄幅市場時，指數比例 +15%（多配指數）

  # 個股波動度調整
  stock_volatility_cap: 0.50  # 個股配置上限 50%

# --- 模組三：新聞驅動選股 ---
news_stock_picker:
  # 追蹤的股票池（台股為主，可擴充美股）
  watch_list:
    # 台股 ETF / 個股（使用 Yahoo Finance 代碼）
    - "0050.TW"   # 元大台灣50
    - "2330.TW"   # 台積電
    - "2317.TW"   # 鴻海
    - "2454.TW"   # 聯發科
    - "2881.TW"   # 富邦金
    - "2882.TW"   # 國泰金
    - "2303.TW"   # 聯電
    - "3711.TW"   # 日月光投控
    - "2412.TW"   # 中華電
    - "2308.TW"   # 台達電

  # 分析回溯期間（天數）
  lookback_days: 90

  # 篩選條件
  selection:
    min_news_score: 0.6        # 最低新聞正面分數
    min_momentum_score: 0.5    # 最低動能分數
    max_picks: 5               # 最多推薦幾檔

# --- 大盤指數設定 ---
market:
  index_symbol: "^TWII"       # 台灣加權指數
  index_etf: "0050.TW"        # 追蹤大盤的 ETF
  vix_symbol: "^VIX"          # VIX 恐慌指數
  risk_free_rate: 0.015       # 無風險利率（台灣定存約 1.5%）

# --- 報告設定 ---
report:
  output_dir: "reports"
  format: "html"               # html 或 text
  auto_open: true              # 產生後自動開啟瀏覽器

# --- Web 伺服器設定 ---
web:
  port: 5000                   # 監聽埠號
  refresh_interval_seconds: 3600  # 自動重新分析間隔（秒），預設 1 小時
